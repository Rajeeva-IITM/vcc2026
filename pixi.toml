[workspace]
authors = ["Rajeeva-IITM <bt20d204@smail.iitm.ac.in>"]
channels = ["conda-forge"]
name = "vcc2026"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
polars = ">=1.38,<2"
scipy = ">=1.17,<2"
anndata = ">=0.13.2,<0.14"
numpy = ">=2.3.2,<3"
marimo = ">=0.24.0,<0.25"
notebook = ">=7.4.4,<8"
# The notebook reads .env through this.
python-dotenv = ">=1.0,<2"

[pypi-dependencies]
# `vcc prep` / `vcc submit` for building and uploading the 2026 submission.
vcc-cli = ">=0.1.0, <0.2"
